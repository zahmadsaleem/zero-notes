name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - demo.html
      - local-text-notes.js
      - chrome-extension/icons/icon-48.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble demo
        run: |
          mkdir -p _site/chrome-extension/icons
          cp demo.html _site/index.html
          cp local-text-notes.js _site/
          cp chrome-extension/icons/icon-48.png _site/chrome-extension/icons/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
